name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "rspec (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        rails: ["8.0", "8.1"]
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Build the dummy app's test database from db/schema.rb. Its storage/ dir
      # is gitignored, so create it first, then prepare explicitly — loading the
      # schema the same way on every Rails line, rather than relying on
      # maintain_test_schema! (which doesn't auto-load a fresh DB on Rails 8.0).
      - run: mkdir -p spec/dummy/storage
      - run: bin/rails db:test:prepare
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec standardrb
